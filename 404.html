<!DOCTYPE html>
<html lang="nl" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="project-name" content="Speech OS">
    <title>404 — Pagina Niet Gevonden | Speech OS</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    
    <!-- Optionele CDNs (met graceful fallback als CSP ze blokkeert) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        if (window.tailwind) {
            tailwind.config = {
                darkMode: 'class',
                theme: {
                    extend: {
                        fontFamily: {
                            sans: ['Inter', 'sans-serif'],
                            display: ['Space Grotesk', 'Inter', 'sans-serif'],
                        }
                    }
                }
            };
        }
    </script>
    
    <!-- 100% Zelfstandige CSS: Volledig Transparante Logo Weergave (Zonder achtergrond) -->
    <style>
        :root {
            --bg-primary: #ffffff;
            --text-primary: #0a0a0a;
            --text-secondary: #737373;
            --card-surface: rgba(255, 255, 255, 0.82);
            --card-border: rgba(0, 0, 0, 0.12);
            --accent: #0ea5e9;
            --btn-bg: #000000;
            --btn-text: #ffffff;
        }

        html.dark {
            --bg-primary: #070709;
            --text-primary: #fafafa;
            --text-secondary: #a3a3a3;
            --card-surface: rgba(14, 14, 18, 0.82);
            --card-border: rgba(255, 255, 255, 0.14);
            --btn-bg: #ffffff;
            --btn-text: #000000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
            user-select: none;
            position: relative;
            transition: background-color 0.45s cubic-bezier(0.16, 1, 0.3, 1), color 0.45s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #bg-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .vignette {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background: radial-gradient(circle at center, transparent 25%, rgba(255, 255, 255, 0.65) 100%);
            transition: background 0.5s ease;
        }
        html.dark .vignette {
            background: radial-gradient(circle at center, transparent 25%, rgba(7, 7, 9, 0.75) 100%);
        }

        /* Header met 100% transparant logo */
        .top-header {
            position: relative;
            z-index: 20;
            width: 100%;
            max-width: 1152px;
            margin: 0 auto;
            padding: 2rem 1.5rem 1rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-link {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            text-decoration: none;
            color: inherit;
        }

        /* Geen achtergrond, geen rand, puur transparant */
        .brand-logo-badge {
            width: 42px;
            height: 42px;
            background: transparent !important;
            box-shadow: none !important;
            border: none !important;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            overflow: visible;
            transition: transform 0.3s ease;
        }
        .brand-link:hover .brand-logo-badge {
            transform: scale(1.1) rotate(3deg);
        }

        .brand-logo-badge img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: transparent !important;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.15));
        }

        .brand-name {
            font-family: 'Space Grotesk', 'Inter', sans-serif;
            font-weight: 700;
            font-size: 1.05rem;
            letter-spacing: -0.02em;
        }

        .theme-btn {
            padding: 0.6rem;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            background: var(--card-surface);
            backdrop-filter: blur(12px);
            cursor: pointer;
            color: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        .theme-btn:hover {
            transform: scale(1.06);
            border-color: var(--text-primary);
        }

        /* 3D Main Section */
        .main-stage {
            position: relative;
            z-index: 10;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            text-align: center;
            perspective: 1200px;
            transform-style: preserve-3d;
        }

        .preserve-3d {
            transform-style: preserve-3d;
            will-change: transform;
        }

        @keyframes float3D {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .rig-container {
            display: flex;
            align-items: center;
            justify-content: center;
            animation: float3D 6s ease-in-out infinite;
            transform-style: preserve-3d;
            margin: 1.5rem 0;
            max-width: 100%;
        }

        .digit-4 {
            position: relative;
            transform-style: preserve-3d;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 900;
            font-size: clamp(5.5rem, 18vw, 14rem);
            line-height: 1;
            letter-spacing: -0.05em;
        }

        .digit-layer-back {
            position: absolute;
            color: rgba(0, 0, 0, 0.04);
            transform: translateZ(-50px);
            pointer-events: none;
        }
        html.dark .digit-layer-back {
            color: rgba(255, 255, 255, 0.04);
        }

        .digit-layer-front {
            color: var(--text-primary);
            transform: translateZ(20px);
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.15));
        }

        /* 3D Vrij Zwevend Bedrijfslogo (ZONDER ACHTERGROND) */
        .centerpiece {
            position: relative;
            margin: 0 clamp(0.75rem, 2.5vw, 2.5rem);
            cursor: pointer;
            transform-style: preserve-3d;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Puur transparante container zonder kaart, zonder rand, zonder schaduwbox */
        .center-logo-box {
            width: clamp(100px, 22vw, 220px);
            height: clamp(100px, 22vw, 220px);
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent !important;
            box-shadow: none !important;
            border: none !important;
            transform: translateZ(45px);
            transition: transform 0.65s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .center-logo-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            background: transparent !important;
            /* Zachte 3D diepteschaduw achter het transparante logo zelf */
            filter: drop-shadow(0 20px 35px rgba(0, 0, 0, 0.28));
            transition: transform 0.4s ease;
        }
        html.dark .center-logo-box img {
            filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.85)) drop-shadow(0 0 25px rgba(255, 255, 255, 0.08));
        }

        .centerpiece:hover .center-logo-box img {
            transform: scale(1.08);
        }

        .fallback-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: transparent !important;
        }
        .fallback-center span {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 900;
            font-size: clamp(2.5rem, 7vw, 4.5rem);
            line-height: 1;
            color: var(--text-primary);
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.2));
        }

        /* CTA & Typography */
        .copy-title {
            font-family: 'Space Grotesk', 'Inter', sans-serif;
            font-size: clamp(1.25rem, 3.5vw, 1.85rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-top: 1rem;
        }

        .copy-desc {
            color: var(--text-secondary);
            font-size: clamp(0.85rem, 2vw, 1rem);
            margin-top: 0.5rem;
            max-width: 440px;
        }

        .cta-btn {
            margin-top: 1.75rem;
            display: inline-flex;
            align-items: center;
            gap: 0.65rem;
            padding: 0.85rem 1.75rem;
            border-radius: 16px;
            background: var(--btn-bg);
            color: var(--btn-text);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.18);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
        }
        .cta-btn:hover {
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
            transform: scale(1.04);
        }

        /* Footer */
        .bottom-footer {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 1152px;
            margin: 0 auto;
            padding: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        #toast {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            z-index: 50;
            padding: 0.65rem 1.15rem;
            border-radius: 12px;
            background: var(--btn-bg);
            color: var(--btn-text);
            font-size: 0.8rem;
            font-weight: 500;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            opacity: 0;
            transform: translateY(12px);
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none;
        }
        #toast.visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <!-- 3D Canvas (ondersteunt Three.js EN standalone HTML5 Canvas fallback) -->
    <canvas id="bg-canvas"></canvas>
    <div class="vignette"></div>

    <!-- Header met ECHT Transparant Bedrijfslogo (Zonder achtergrondbox) -->
    <header class="top-header">
        <a href="/" onclick="handleNavClick(event)" class="brand-link" aria-label="Speech OS Home">
            <div class="brand-logo-badge">
                <img src="/jdlogo-dark-mark.png" alt="Speech OS Logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" />
                <span style="display:none; font-family:'Space Grotesk',sans-serif; font-weight:800; font-size:1.1rem; color:var(--text-primary);">SOS</span>
            </div>
            <span class="brand-name">Speech OS</span>
        </a>

        <button onclick="toggleTheme()" class="theme-btn" aria-label="Wissel thema">
            <svg id="icon-sun" style="width:20px; height:20px; display:none;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="4"></circle>
                <path stroke-linecap="round" d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41"></path>
            </svg>
            <svg id="icon-moon" style="width:20px; height:20px; display:block;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path>
            </svg>
        </button>
    </header>

    <!-- Main Content Stage -->
    <main class="main-stage">
        
        <div id="rig-3d" class="rig-container">
            <!-- Linker '4' -->
            <div id="digit-left-group" class="digit-4">
                <span class="digit-layer-back">4</span>
                <span class="digit-layer-front">4</span>
            </div>

            <!-- Middelste 3D Bedrijfslogo (VRIJ ZWEVEND ZONDER ACHTERGRONDBOX) -->
            <div id="company-centerpiece" onclick="triggerLogoPulse(event)" class="centerpiece" title="Klik voor 3D interactie">
                <div id="center-logo-box" class="center-logo-box">
                    <img src="/jdlogo-dark-mark.png" alt="Speech OS" onerror="this.style.display='none'; document.getElementById('fallback-center').style.display='flex';" />
                    <div id="fallback-center" class="fallback-center" style="display:none;">
                        <span>SOS</span>
                    </div>
                </div>
            </div>

            <!-- Rechter '4' -->
            <div id="digit-right-group" class="digit-4">
                <span class="digit-layer-back">4</span>
                <span class="digit-layer-front">4</span>
            </div>
        </div>

        <div class="preserve-3d">
            <h1 class="copy-title">Pagina niet gevonden.</h1>
            <p class="copy-desc">Deze link bestaat niet binnen Speech OS of is verplaatst.</p>
        </div>

        <div>
            <!-- Navigeert altijd terug naar de startpagina van dit specifieke project -->
            <a id="magnetic-btn" href="/" onclick="handleNavClick(event)" class="cta-btn">
                <svg style="width:16px; height:16px;" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                <span>Terug naar Home</span>
            </a>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bottom-footer">
        <span style="font-weight:600; color:var(--text-primary);">© Speech OS</span>
        <span style="font-family:monospace;">404</span>
    </footer>

    <!-- Toast Notification -->
    <div id="toast">Terug naar startpagina...</div>

    <script>
        // --- 1. Navigatie ---
        const baseHref = document.querySelector('base')?.getAttribute('href');
        const TARGET_HOME = baseHref || "/";

        function handleNavClick(e) {
            e.preventDefault();
            const targetUrl = e.currentTarget.getAttribute('href') || TARGET_HOME;
            const toast = document.getElementById('toast');
            toast.classList.add('visible');
            setTimeout(() => {
                window.location.href = targetUrl;
            }, 300);
        }

        // --- 2. Dark/Light Mode ---
        function applyTheme(isDark) {
            if (isDark) {
                document.documentElement.classList.add('dark');
                document.getElementById('icon-sun').style.display = 'block';
                document.getElementById('icon-moon').style.display = 'none';
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('icon-sun').style.display = 'none';
                document.getElementById('icon-moon').style.display = 'block';
            }
        }

        const savedTheme = localStorage.getItem('theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        applyTheme(savedTheme === 'dark' || (!savedTheme && systemPrefersDark));

        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            applyTheme(isDark);
            if (terrainMesh) {
                terrainMesh.material.color.setHex(isDark ? 0xffffff : 0x000000);
                terrainMesh.material.opacity = isDark ? 0.11 : 0.08;
            }
            shockwaveStrength = 3.5;
        }

        // --- 3. 3D Parallax & Mouse Physics ---
        const rig3D = document.getElementById('rig-3d');
        const centerLogo = document.getElementById('center-logo-box');
        const digitLeftGroup = document.getElementById('digit-left-group');
        const digitRightGroup = document.getElementById('digit-right-group');
        const magneticBtn = document.getElementById('magnetic-btn');

        let mouseX = 0, mouseY = 0;
        let smoothX = 0, smoothY = 0;
        let isScrambled = false;
        let shockwaveStrength = 0;
        let shockwaveOrigin = { x: 0, y: 0 };

        window.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth) * 2 - 1;
            mouseY = (e.clientY / window.innerHeight) * 2 - 1;

            if (magneticBtn) {
                const rect = magneticBtn.getBoundingClientRect();
                const distX = e.clientX - (rect.left + rect.width / 2);
                const distY = e.clientY - (rect.top + rect.height / 2);
                const dist = Math.hypot(distX, distY);
                if (dist < 130) {
                    const pull = (1 - dist / 130) * 0.35;
                    magneticBtn.style.transform = `translate3d(${distX * pull}px, ${distY * pull}px, 10px) scale(1.04)`;
                } else {
                    magneticBtn.style.transform = 'translate3d(0,0,0) scale(1)';
                }
            }
        });

        function triggerLogoPulse(e) {
            if (e) e.stopPropagation();
            isScrambled = !isScrambled;
            shockwaveOrigin.x = 0;
            shockwaveOrigin.y = 0;
            shockwaveStrength = 5.5;

            if (isScrambled) {
                centerLogo.style.transform = 'translate3d(0px, 0px, 95px) rotate(14deg) scale(1.2)';
                digitLeftGroup.style.transform = 'translate3d(-35px, -15px, 45px) rotateY(-20deg)';
                digitRightGroup.style.transform = 'translate3d(35px, 15px, 45px) rotateY(20deg)';
            } else {
                centerLogo.style.transform = 'translate3d(0px, 0px, 45px) rotate(0deg) scale(1)';
                digitLeftGroup.style.transform = 'translate3d(0px, 0px, 0px) rotateY(0deg)';
                digitRightGroup.style.transform = 'translate3d(0px, 0px, 0px) rotateY(0deg)';
            }
        }

        // --- 4. Interactive Background (Three.js OR Native Canvas Fallback) ---
        let scene, camera, renderer, terrainMesh, floatingShapes = [];
        let canvas = document.getElementById('bg-canvas');
        let ctx = null;
        let useNativeCanvas = false;

        function initBackground() {
            if (typeof THREE !== 'undefined') {
                try {
                    scene = new THREE.Scene();
                    camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);
                    camera.position.set(0, -14, 24);
                    camera.lookAt(0, 0, 0);

                    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

                    const planeGeo = new THREE.PlaneGeometry(44 * 1.65, 28 * 1.65, 44, 28);
                    const isDark = document.documentElement.classList.contains('dark');
                    const planeMat = new THREE.MeshBasicMaterial({
                        color: isDark ? 0xffffff : 0x000000,
                        wireframe: true,
                        transparent: true,
                        opacity: isDark ? 0.11 : 0.08
                    });
                    terrainMesh = new THREE.Mesh(planeGeo, planeMat);
                    scene.add(terrainMesh);
                    return;
                } catch (e) {
                    console.warn("Three.js kon niet starten, native canvas fallback actief:", e);
                }
            }

            // Native 2D Canvas Fallback (100% CSP Veilig, geen externe scripts vereist)
            useNativeCanvas = true;
            ctx = canvas.getContext('2d');
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
        }

        function resizeCanvas() {
            if (!useNativeCanvas) return;
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        let clock = 0;
        function animate() {
            requestAnimationFrame(animate);
            clock += 0.02;

            smoothX += (mouseX - smoothX) * 0.075;
            smoothY += (mouseY - smoothY) * 0.075;

            if (rig3D) {
                rig3D.style.transform = `rotateX(${-smoothY * 16}deg) rotateY(${smoothX * 20}deg)`;
            }

            if (useNativeCanvas && ctx) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const isDark = document.documentElement.classList.contains('dark');
                ctx.strokeStyle = isDark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.06)';
                ctx.lineWidth = 1;

                // Animated perspective grid
                const horizonY = canvas.height * 0.65 + smoothY * 40;
                const vpX = canvas.width * 0.5 + smoothX * 60;
                const numLines = 22;

                for (let i = -numLines; i <= numLines; i++) {
                    ctx.beginPath();
                    ctx.moveTo(vpX, horizonY);
                    const bottomX = vpX + i * 75 + Math.sin(clock + i) * 10;
                    ctx.lineTo(bottomX, canvas.height);
                    ctx.stroke();
                }

                // Horizontal flowing wave lines
                for (let j = 0; j < 12; j++) {
                    const progress = (j / 12 + (clock * 0.1)) % 1;
                    const y = horizonY + Math.pow(progress, 2.2) * (canvas.height - horizonY);
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(canvas.width, y);
                    ctx.stroke();
                }
            } else if (renderer && scene && camera) {
                if (camera) {
                    camera.position.x = smoothX * 4;
                    camera.position.y = -14 - smoothY * 3;
                    camera.lookAt(0, 1, 0);
                }
                renderer.render(scene, camera);
            }
        }

        window.onload = function() {
            initBackground();
            animate();
        };
    </script>
</body>
</html>
