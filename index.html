    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap');
      
      :root {
        --palette-grey-0: #FFFFFF;
        --palette-grey-1200: #121317;
        --palette-grey-1100: #18191D;
        --palette-grey-1000: #212226;
        --theme-surface-on-surface: #E6EAF0;
        --theme-surface-on-surface-variant: #B7BFD9;
        --theme-outline-variant: rgba(230, 234, 240, 0.06);
        --theme-primary: #3186FF;
      }

      body {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--palette-grey-1200);
        color: var(--theme-surface-on-surface);
        margin: 0;
        min-height: 100vh;
        overscroll-behavior-y: contain;
      }
      
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Space Grotesk', sans-serif;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #45474D; 
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #B2BBC5; 
      }

      /* Houdini PaintWorklet Definitions */
      @property --animation-tick { syntax: '<number>'; inherits: false; initial-value: 0; }
      @property --ring-radius { syntax: '<number> | auto'; inherits: false; initial-value: auto; }
      @property --ring-x { syntax: '<number>'; inherits: false; initial-value: 50; }
      @property --ring-y { syntax: '<number>'; inherits: false; initial-value: 50; }
      @property --ring-interactive { syntax: '<number>'; inherits: false; initial-value: 0; }

      @keyframes ripple { 0% { --animation-tick: 0; } 100% { --animation-tick: 1; } }
      @keyframes ring { 0% { --ring-radius: 150; } 100% { --ring-radius: 250; } }

      /* Typewriter Effect */
      @keyframes blink { from { opacity: 0; } }
      @keyframes text { from { background-size: 0 } }
      
      .typewriter {
        background: 
          linear-gradient(90deg, var(--theme-surface-on-surface) 0 0) 0 / calc(var(--n, 100) * 1ch) no-repeat 
          transparent;
        -webkit-background-clip: text;
        color: transparent;
        animation: text 2s ease-in both;
      }
      .typewriter::after {
        content: "|";
        background: linear-gradient(#ff4700, #0ff);
        -webkit-background-clip: text;
        color: transparent;
        animation: blink 0.2s 1.4s ease infinite alternate both;
      }
    </style>
